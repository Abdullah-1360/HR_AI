services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr_ai_postgres
    environment:
      POSTGRES_USER: hr_ai
      POSTGRES_PASSWORD: hr_ai_secret
      POSTGRES_DB: hr_ai_router
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./router/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_ai -d hr_ai_router"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: hr_ai_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hr_ai_minio
      MINIO_ROOT_PASSWORD: hr_ai_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://84.8.248.101:3006
    container_name: hr_ai_frontend
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://84.8.248.101:3006
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

