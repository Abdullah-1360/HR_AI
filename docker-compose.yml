services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_ai_postgres
    environment:
      POSTGRES_USER: hr_ai
      POSTGRES_PASSWORD: hr_ai_secret
      POSTGRES_DB: hr_ai_router
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./router/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_ai -d hr_ai_router"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
